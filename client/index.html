<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Note Taking App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>📝 My Notes</h1>
            <p>Simple Full-Stack Note Taking Application</p>
        </header>

        <section class="note-form">

            <input
                type="text"
                id="title"
                placeholder="Note title"
            >

            <textarea
                id="content"
                placeholder="Write your note here..."
            ></textarea>

            <button id="addNote">
                Add Note
            </button>

        </section>

        <section>

            <h2>Your Notes</h2>

            <div id="notesContainer">
                <p class="loading">Loading notes...</p>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
